<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--app:head-->
    <script>
      // Runs before first paint: flags for JS and motion. The loading globe is skipped with
      // reduced motion and on deep links (#team), which should land without a wait.
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        var off =
          /[?&]motion=off\b/.test(location.search) ||
          (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
        root.classList.add(off ? 'motion-off' : 'motion-ok');
        if (off || location.hash) root.classList.add('no-loader');
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app:body--></div>
    <!--app:data-->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
